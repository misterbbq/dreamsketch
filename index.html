<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Générateur de petits mots doux et romantiques pour exprimer votre amour">
    <title> Mots Doux </title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="as-coeur.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="hearts-container" id="hearts"></div>
        
    <button class="theme-toggle" id="themeToggle" aria-label="Basculer le mode sombre">
        <span class="icon-sun">☀️</span>
        <span class="icon-moon">🌙</span>
    </button>

        

    <main id="generator" class="container" style="display: block;">
        <header>
            <div id="timer" class="timer">Temps restant : ...</div>
            <h1>💕 Mots Doux</h1>
            <p class="subtitle">Un petit mot d'amour pour illuminer ta journée</p>
        </header>

        <div class="phrase-card" id="phraseCard">
            <p class="phrase" id="phrase">Clique sur le bouton pour découvrir un mot doux...</p>
        </div>

        <div class="buttons">
            <button class="btn btn-primary" id="generateBtn">
                <span>✨</span> Générer
            </button>
            <button class="btn btn-secondary" id="copyBtn">
                <span id="copyIcon">📋</span> <span id="copyText">Copier</span>
            </button>
        </div>
        
    </main>
    <div class="buttons">
        <button class="btn btn-secondary" id="prgrmBtn">
            <span>💝</span> Programme
        </button>
    </div>

    <footer>
        <p>Fait par ton amoureux MB ❤️</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
